#
# KEY NAVIGATION
#

[[pick.prepend_keymap]]
on = "i"
run = "arrow prev"
desc = "Move up"

[[select.prepend_keymap]]
on = "i"
run = "arrow -1"
desc = "Move up"

[[mgr.prepend_keymap]]
on = "i"
run = "arrow prev"
desc = "Move up"

[[pick.prepend_keymap]]
on = "k"
run = "arrow next"
desc = "Move down"

[[select.prepend_keymap]]
on = "k"
run = "arrow 1"
desc = "Move down"

[[mgr.prepend_keymap]]
on = "k"
run = "arrow next"
desc = "Move down"

[[mgr.prepend_keymap]]
on = "l"
run = "enter"
desc = "Enter / open"

#
# FOLDER NAVIGATION
#

[[mgr.prepend_keymap]]
on = ["g", "h"]
run = "cd ~"
desc = "Home"

[[mgr.prepend_keymap]]
on = ["g", "l"]
run = "cd ~/Desk"
desc = "Desk"

[[mgr.prepend_keymap]]
on = ["g", "w"]
run = "cd ~/DLs"
desc = "DLs"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Docs"
desc = "Docs"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "cd ~/Musk"
desc = "Musk"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Pix"
desc = "Pix"

[[mgr.prepend_keymap]]
on = ["g", "v"]
run = "cd ~/Vidz"
desc = "Vidz"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "cd ~/tmp"
desc = "tmp"

[[mgr.prepend_keymap]]
on = ["g", "T"]
run = "cd ~/.local/share/Trash/files"
desc = "Trash"

[[mgr.prepend_keymap]]
on = ["g", "f"]
run = "cd ~/.dotfiles"
desc = ".dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "e"]
run = "cd ~/.emacs.d"
desc = "emacs.d"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd ~/.config"
desc = ".config"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "cd ~/.scripts"
desc = ".scripts"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = "cd ~/Docs/11.git_docs"
desc = "git_docs"

[[mgr.prepend_keymap]]
on = ["g", "i"]
run = "cd /run/media/$USER"
desc = "MEDIA"

[[mgr.prepend_keymap]]
on = ["g", "/"]
run = "cd /"
desc = "ROOT"

[[mgr.prepend_keymap]]
on = "j"
run = "leave"
desc = "go to TOP"

#
# RENAMING
#

[[mgr.prepend_keymap]]
on = "A"
run = "rename --cursor=end"
desc = "Rename, cursor at end"

[[mgr.prepend_keymap]]
on = "I"
run = "rename --cursor=start"
desc = "Rename, cursor at start"

[[mgr.prepend_keymap]]
on = "a"
run = "rename --cursor=before_ext"
desc = "Rename, cursor before extension"

[[mgr.prepend_keymap]]
on = "h"
run = "shell 'bat \"$1\"' --block --confirm"
desc = "Peek file in pager"

#
# CUSTOM ACTIONS
#

[[mgr.prepend_keymap]]
on = ["b", "p"]
run = "shell 'RANGER_send2phone $@' --confirm=always"
desc = "Send to phone"

[[mgr.prepend_keymap]]
on = ["b", "z"]
run = "shell 'zip -r a.zip $@' --confirm=always"
desc = "Zip selection"

[[mgr.prepend_keymap]]
on = ["b", "d"]
run = "shell 'ripdrag -a -x $@'"
desc = "Drag 'n Drop (wl native)"

